# Local development stack.
#
# Production uses Neon for Postgres and Upstash for Redis (DEC-010); this file
# exists so the project can be run and marked without any external account.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: holibrary
      POSTGRES_PASSWORD: holibrary
      POSTGRES_DB: holibrary
    ports:
      # 55432 on the host, not 5432: a developer machine often already runs a
      # local Postgres on the default port, and a host-side tool would silently
      # connect to that instead of this container. The API is unaffected either
      # way -- it reaches the database as db:5432 over the compose network.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations are NOT mounted here any more. The API applies them at
      # startup from its embedded copy, which is the same code path production
      # uses -- so a migration that works locally has been tested, rather than
      # merely having worked under a different mechanism.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: development
      DATABASE_URL: postgres://holibrary:holibrary@db:5432/holibrary?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-secret-not-for-production-use-32
      CORS_ORIGINS: http://localhost:5173
      # Demonstration data, with published credentials. Development only.
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
