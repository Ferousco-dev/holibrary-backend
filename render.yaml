# Render blueprint for the HOLibrary backend.
#
# The database and Redis are deliberately NOT declared here. Render's own
# Postgres expires after 30 days on the free plan, which would mean rebuilding
# the library's records the week of the defence; Neon's free tier does not
# expire. Redis is Upstash for the same reason. Both are configured as
# environment variables rather than as Render resources.

services:
  - type: web
    name: holibrary-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main

    # Deployment is driven by the GitHub Actions pipeline, not by pushes.
    # Render's own auto-deploy would build straight from a commit, before the
    # tests have run, which would put an untested version in front of students.
    # The workflow deploys through the API once everything is green, then smoke
    # tests the result.
    autoDeploy: false

    # Render polls this. It reports whether the database is actually reachable,
    # not merely whether the process is alive, so a service that has lost its
    # database is reported unhealthy rather than quietly failing every request.
    healthCheckPath: /healthz

    envVars:
      - key: ENV
        value: production

      # Generated by Render and never seen by anyone. A secret nobody has read
      # is a secret nobody can leak.
      - key: JWT_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 168h

      # Set in the Render dashboard, not here. This file is committed to a
      # public repository.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false

      - key: MAIL_FROM
        value: holibrary@appmd.dev

      # Password reset links are built from this.
      - key: FRONTEND_URL
        value: https://library.appmd.dev

      # The Vercel frontend. A wildcard would let any site on the internet read
      # a member's borrowing history.
      - key: CORS_ORIGINS
        sync: false

      # Render terminates TLS and sets X-Forwarded-For, and the origin is not
      # otherwise reachable, so the forwarded address can be believed. If that
      # ever stops being true, set this back to false: a forgeable header is
      # worse than no header, because it can be used to lock a member out.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      # Never true in production. The seeded accounts have passwords published
      # in this repository; the service refuses to start if this is set.
      - key: SEED_DEMO_DATA
        value: "false"

      - key: OPENLIBRARY_BASE_URL
        value: https://openlibrary.org
