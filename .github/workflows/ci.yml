# Continuous integration and deployment (NFR-013).
#
# The shape is deliberate:
#
#   test  ->  deploy  ->  smoke
#
# Nothing deploys that has not passed its tests, and nothing is called deployed
# until the running service has been checked from the outside. Render's own
# auto-deploy would build straight from a push, which is faster and worse: it
# would put an untested commit in front of students.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a deployment be re-run without an empty commit.
  workflow_dispatch:

env:
  GO_VERSION: '1.27'
  RENDER_SERVICE_ID: srv-dacuhqad0e5s73fhol80
  PRODUCTION_URL: https://api.library.appmd.dev

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies are tidy
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # -race catches data races that only appear under concurrency, which is
      # exactly the class of bug the borrowing path is designed to avoid.
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      # NFR-012: at least 70% statement coverage on the packages that hold
      # business rules. The transport and repository layers are excluded on
      # purpose -- they are covered by the integration checks, and chasing a
      # percentage there rewards testing the framework rather than the library.
      - name: Enforce coverage on business-logic packages
        run: |
          fail=0
          for pkg in domain service auth; do
            pct=$(go test -cover ./internal/$pkg/ 2>/dev/null \
                  | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+')
            printf '%-10s %s%%\n' "$pkg" "$pct"
            if [ "$(echo "$pct < 70" | bc -l)" -eq 1 ]; then
              echo "  below the 70% gate (NFR-012)"
              fail=1
            fi
          done
          exit $fail

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck reports only vulnerabilities in code paths this binary
      # actually reaches, rather than every advisory touching the dependency
      # tree. A scanner that cries wolf gets ignored, which is worse than none.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An applied migration must never change. The migrator records a checksum
      # and refuses to run when one no longer matches, which is correct but
      # discovers the problem at startup in production. Catching it here means
      # the pull request fails instead of the deployment.
      - name: Applied migrations must not be edited
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          changed=$(git diff --name-status "$base" HEAD -- internal/migrate/sql/ || true)
          edited=$(printf '%s\n' "$changed" | awk '$1 == "M" || $1 == "D" {print $2}')
          if [ -n "$edited" ]; then
            echo "These migrations were modified or deleted:"
            echo "$edited"
            echo
            echo "A migration that has already run cannot be changed: the database"
            echo "and the repository would disagree about history. Add a new"
            echo "numbered file instead."
            exit 1
          fi
          echo "No applied migration was modified."

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t holibrary-backend:ci .
      - name: Report image size
        run: docker images holibrary-backend:ci --format '{{.Size}}'

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Only from main, and only once everything else is green. A deployment that
    # can outrun its tests is not a pipeline, it is a push with extra steps.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, security, migrations, docker]
    steps:
      - name: Trigger a deploy and wait for it
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY is not set; skipping deployment."
            echo "Add it at Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          deploy_id=$(curl -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "deploy: $deploy_id"

          # Poll rather than assume. A deploy that fails silently and leaves the
          # previous version running is the failure mode that looks like success.
          for i in $(seq 1 60); do
            status=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "  [$i] $status"
            case "$status" in
              live) echo "deployed"; exit 0;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "deployment failed: $status"; exit 1;;
            esac
            sleep 15
          done
          echo "timed out waiting for the deploy"; exit 1

  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4

      # Checking the deployment from the outside, as a client sees it. A green
      # build proves the code compiles; only this proves the service works.
      - name: The service is healthy
        run: |
          body=$(curl -sS --retry 5 --retry-delay 10 --retry-all-errors \
                 -A 'HOLibrary-CI/1.0' "${PRODUCTION_URL}/healthz")
          echo "$body"
          echo "$body" | grep -q '"database":"reachable"' \
            || { echo "the service cannot reach its database"; exit 1; }

      - name: The documentation renders and the specification parses
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'HOLibrary-CI/1.0' "${PRODUCTION_URL}/docs")
          [ "$code" = "200" ] || { echo "/docs returned $code"; exit 1; }
          curl -sS -A 'HOLibrary-CI/1.0' "${PRODUCTION_URL}/openapi.yaml" \
            | python3 -c 'import yaml,sys; d=yaml.safe_load(sys.stdin); print(len(d["paths"]), "paths")'

      - name: The catalogue is public and personal data is not
        run: |
          public=$(curl -sS -o /dev/null -w '%{http_code}' -A 'HOLibrary-CI/1.0' "${PRODUCTION_URL}/api/v1/books")
          [ "$public" = "200" ] || { echo "the catalogue should be public, got $public"; exit 1; }

          members=$(curl -sS -o /dev/null -w '%{http_code}' -A 'HOLibrary-CI/1.0' "${PRODUCTION_URL}/api/v1/members")
          [ "$members" = "401" ] || { echo "the member roll must require a token, got $members"; exit 1; }

      - name: CORS admits the frontend and nobody else
        run: |
          allowed=$(curl -sS -D - -o /dev/null -X OPTIONS -A 'HOLibrary-CI/1.0' \
            -H 'Origin: https://library.appmd.dev' \
            -H 'Access-Control-Request-Method: POST' \
            "${PRODUCTION_URL}/api/v1/auth/login" | grep -ci 'access-control-allow-origin' || true)
          [ "$allowed" -ge 1 ] || { echo "the frontend origin was refused"; exit 1; }

          stranger=$(curl -sS -D - -o /dev/null -X OPTIONS -A 'HOLibrary-CI/1.0' \
            -H 'Origin: https://not-the-frontend.example.com' \
            -H 'Access-Control-Request-Method: POST' \
            "${PRODUCTION_URL}/api/v1/auth/login" | grep -ci 'access-control-allow-origin' || true)
          [ "$stranger" = "0" ] || { echo "an unknown origin was allowed"; exit 1; }

      - name: Security headers are present
        run: |
          headers=$(curl -sSI -A 'HOLibrary-CI/1.0' "${PRODUCTION_URL}/healthz")
          for h in strict-transport-security x-content-type-options x-frame-options; do
            echo "$headers" | grep -qi "$h" || { echo "missing header: $h"; exit 1; }
          done
          echo "all present"
